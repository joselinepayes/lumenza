services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumenza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-lumenza}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Almacenamiento S3 compatible SOLO para desarrollo local (producción: Amazon S3).
  rustfs:
    image: rustfs/rustfs:1.0.5@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?define S3_ACCESS_KEY_ID en .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?define S3_SECRET_ACCESS_KEY en .env}
    ports:
      - "127.0.0.1:9100:9000"   # API S3 (9000/9001 pueden estar ocupados por otros proyectos)
      - "127.0.0.1:9101:9001"   # consola
    volumes: [rustfsdata:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
  # Captura de correo SOLO para desarrollo local. Escucha únicamente en 127.0.0.1; nunca se publica ni envía a Internet.
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # UI y API web
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
  # Worker de procesamiento de fotografías (Sharp). Mismo código que la API; consume la cola pg-boss (PostgreSQL).
  # Perfil opcional en local (el desarrollo usa `npm run dev:worker`): docker compose --profile worker up -d --build worker
  worker:
    profiles: ["worker"]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      rustfs: { condition: service_healthy }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-lumenza}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lumenza}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-lumenza-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      WORKER_CONCURRENCY: "2"
    mem_limit: 1g
volumes:
  pgdata:
  rustfsdata:
